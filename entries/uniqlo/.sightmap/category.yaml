version: 1

views:
  - name: CategoryListing
    route: /us/en/:gender/:category
    url: https://www.uniqlo.com/us/en/men/tops
    description: Category listing — sticky subcategory tabs above a product grid.
    memory:
      - Identified by `.fr-ec-template-plp` on the content root. That class is a
        more reliable page-type check than the URL, since the same
        `/us/en/:gender/:path` shape also serves editorial pages.
      - Subcategory navigation is a sticky tab strip (`.fr-ec-sticky-tabs`) whose
        entries are links, so the whole subcategory tree can be walked without
        clicking.
      - The grid is `.fr-ec-product-collection` holding `.product-tile`
        children, the same pair search renders, so one set of selectors covers
        both surfaces. Do not reach for `.fr-ec-product-tile` — that class
        belongs to the recommendation carousels, and this page has none.
    components:
      - name: CategoryTemplate
        selector: '.fr-ec-template-plp'

      - name: StickyTabs
        selector: '.fr-ec-sticky-tabs'
        properties:
          - name: tabs
            extract: text

      - name: LineupLinks
        selector: '#lineupLinkWrapper'
        properties:
          - name: lineup
            extract: text
        memory:
          - The category heading and its subcategory links.

      - name: ProductGrid
        selector: '.fr-ec-product-collection'
        children:
          - name: ProductTile
            selector: '.product-tile'
            properties:
              - name: tile_text
                extract: text
            children:
              - name: TileImage
                selector: '.product-tile__carousel-wrapper'

    requests:
      - name: ProductSearch
        route: /us/api/commerce/v5/en/products/search
        method: POST
        description: The grid contents as JSON, filtered by taxonomy rather than by a query. The same endpoint keyword search posts to.
