version: 1

views:
  - name: PullList
    route: /:owner/:repo/pulls
    url: https://github.com/sightmap/sightmap/pulls
    description: Open pull requests for a repository, served by the legacy frontend.
    memory:
      - Served by the legacy frontend. Rows are `.js-issue-row`, each with an
        `id` of the form `issue_<number>` — pull requests and issues share one
        row component and one id namespace, which is why a PR row is called an
        issue row.
      - This route and `/issues` look like the same page and are not. Nothing
        that matches here matches there. Check for `.js-issue-row` before
        assuming which one you are on.
      - The list is server-rendered, so the rows are in the initial document.
    components:
      - name: PullRow
        selector: '.js-issue-row'
        properties:
          - name: row_text
            extract: text
        children:
          - name: PullTitleLink
            selector: 'a[id^="issue_"]'
            properties:
              - name: title
                extract: text
              - name: href
                extract: attr=href

      - name: ListContainer
        selector: '.js-navigation-container'

      - name: IssueNav
        selector: 'nav[aria-label="Issue"]'
        memory:
          - Labelled "Issue" on the pull request list, again because the two
            lists share a component.

  - name: IssueList
    route: /:owner/:repo/issues
    url: https://github.com/sightmap/sightmap/issues
    description: Repository issues, served by the React frontend.
    memory:
      - Served by the React frontend, and structurally unrelated to `/pulls`
        despite rendering an almost identical page. Rows here carry
        `data-testid` attributes and there is no `.js-issue-row` anywhere.
      - Rows are counted by `[data-testid="issue-pr-title-link"]`. Every
        per-row testid appears exactly once per row, so any of them counts the
        page size — 25 by default.
      - The filter controls are `*-anchor-button` testids
        (`authors-`, `labels-`, `projects-`, `milestones-`, `assignees-`,
        `issue-types-`), which is a more stable way to enumerate the available
        facets than reading the filter bar's text.
    components:
      - name: IssueSection
        selector: 'section[aria-label="All issues"]'

      - name: IssueFilters
        selector: 'nav[aria-label="Issue filters"]'
        properties:
          - name: filters
            extract: text

      - name: IssueRowTitle
        selector: '[data-testid="issue-pr-title-link"]'
        properties:
          - name: title
            extract: text
          - name: href
            extract: attr=href

      - name: IssueRowState
        selector: '[data-testid="list-row-state-icon"]'
        memory:
          - Open or closed. The state is an icon with no text, so the row's
            status has to come from this element rather than from row text.

      - name: IssueRowNumber
        selector: '[data-testid="list-row-repo-name-and-number"]'
        properties:
          - name: repo_and_number
            extract: text

      - name: IssueRowCreatedAt
        selector: '[data-testid="created-at"]'
        properties:
          - name: created
            extract: text

      - name: IssueRowComments
        selector: '[data-testid="list-row-comments"]'

      - name: Pagination
        selector: 'nav[aria-label="Pagination"]'

  - name: Releases
    route: /:owner/:repo/releases
    url: https://github.com/sightmap/sightmap/releases
    description: Tagged releases, newest first.
    memory:
      - Each release renders its own `h1`, so the page has as many `h1`
        elements as releases on it rather than one. Counting `h1` is a
        reasonable way to count releases here and a bad habit everywhere else.
    components:
      - name: ReleaseTagLink
        selector: 'a[href*="/releases/tag/"]'
        properties:
          - name: tag
            extract: text
        memory:
          - Matches more than once per release — the tag name, the source
            links, and the anchor heading all point at the same URL. Counting
            these is not counting releases.
