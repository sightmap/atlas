version: 1

views:
  - name: NotFound
    route: /**
    url: https://github.com/sightmap/sightmap/no-such-page-xyz-123
    description: 404 page, served with a real 404 status.
    memory:
      - Returns an actual 404 rather than a 200 with an error body, which is
        rarer than it should be and means the status code can be trusted here.
      - The page has no `h1` at all. Anything keying "did I land somewhere
        real" on the presence of a heading will read this page as a loading
        state. Test for the 404 illustration instead.
    components:
      - name: NotFoundMain
        selector: 'main.font-mktg'
        properties:
          - name: message
            extract: text

      - name: NotFoundArt
        selector: 'img[alt*="404"]'
        memory:
          - The only positive signal on the page that it is a 404.
