version: 1

views:
  - name: OrgProfile
    route: /:org
    url: https://github.com/sightmap
    description: Organization profile — pinned items and the repository list.
    memory:
      - This route is ambiguous by design. `/:org` and `/:user` are the same
        URL shape, and nothing in the path says which one you are on. The
        presence of `nav[aria-label="Organization"]` is the test — a user
        profile does not have it.
      - Repositories are `a[itemprop="name codeRepository"]`. The microdata
        attribute has outlived several redesigns of this page and is the most
        durable hook on it.
      - Only public repositories appear when signed out, so a count read here
        is a count of public repositories and not of the organization's
        repositories.
    requests:
      - name: TabCounts
        route: '/users/:org/tab_counts?repo=*'
        method: GET
        description: The numbers on the Repositories, Projects, and People tabs. Served from the users path even for an organization.

      - name: ParticipationSparkline
        route: '/:owner/:repo/graphs/participation?type=sparkline*'
        method: GET
        description: One call per pinned repository, drawing that repository's commit sparkline.

      - name: SetupBudgetBanner
        route: '/in-product-messaging/tbb-setup-budget-banner?organization=*'
        method: GET
        description: Organization billing prompt. This route replaces the repository-scoped banner on the profile.

    components:
      - name: OrgHeader
        selector: 'header.orghead'
        properties:
          - name: header_text
            extract: text
        children:
          - name: OrgNav
            selector: 'nav[aria-label="Organization"]'
            properties:
              - name: tabs
                extract: text

      - name: OrgSidebar
        selector: 'div[data-view-component="true"].col-md-3'

      - name: PinnedItems
        selector: '.js-pinned-items-reorder-container'
        memory:
          - Legacy markup, still serving the pinned repositories grid.

      - name: RepoList
        selector: '#org-repositories'
        children:
          - name: RepoLink
            selector: 'a[data-hovercard-type="repository"]'
            properties:
              - name: repo_name
                extract: text
              - name: href
                extract: attr=href
